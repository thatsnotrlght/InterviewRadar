services:
  db:
    container_name: interviewradar-db
    image: postgres:latest
    environment:
      POSTGRES_USER: springboot-db
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db:/data/postgres
    ports:
      - "5432:5432"
    networks:
    - db
    restart: unless-stopped

networks:
      db:
        driver: bridge
volumes:
  db: